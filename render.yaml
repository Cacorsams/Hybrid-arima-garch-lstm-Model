services:
  - type: web
    name: school-projects-backend
    runtime: docker
    dockerContext: .
    dockerfilePath: Dockerfile
    plan: starter
    region: ohio
    envVars:
      - key: PORT
        value: 5000
      - key: PYTHON_ENV
        value: production
      # You will need to add your Supabase and API keys in the Render Dashboard
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: ALPHAVANTAGE_API_KEY
        sync: false
      - key: OANADA_API_KEY
        sync: false
