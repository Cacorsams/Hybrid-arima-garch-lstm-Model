# Railway configuration for Hybrid ARIMA-GARCH-LSTM project

version: 3

services:
  backend:
    name: school-projects-backend
    build:
      dockerContext: .
      dockerfilePath: Dockerfile
    deploy:
      numReplicas: 1
      restartPolicyType: ON_FAILURE
    variables:
      PORT: 5000
      PYTHON_ENV: production
